<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Failla's Pizzeria &amp; Ristorante</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a120c;
      --ink-2: #241810;
      --cream: #f4eadb;
      --paper: #f7f1e6;
      --paper-2: #efe4d2;
      --gold: #c9a24a;
      --gold-soft: #e0c078;
      --tomato: #c23b22;
      --muted: #6b5a4a;
      --line: #e2d4bf;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: Outfit, system-ui, sans-serif; }
    .font-display { font-family: "Cormorant Garamond", Georgia, serif; }
    a { color: inherit; text-decoration: none; }
    header { background: var(--ink); color: var(--cream); border-bottom: 1px solid rgba(255,255,255,.1); }
    .bar { max-width: 72rem; margin: 0 auto; padding: 0 1rem; display: flex; align-items: center; gap: .75rem; height: 4.25rem; }
    .logo { display: flex; align-items: center; gap: .75rem; min-width: 0; }
    .logo img { width: 3rem; height: 3rem; border-radius: .4rem; object-fit: cover; }
    .brand { font-family: "Cormorant Garamond", serif; font-size: 1.35rem; color: var(--gold-soft); line-height: 1; }
    .sub { display: block; font-size: .65rem; letter-spacing: .18em; text-transform: uppercase; color: rgba(244,234,219,.7); margin-top: .2rem; }
    nav { margin-left: auto; display: none; gap: .15rem; }
    @media (min-width: 900px) { nav { display: flex; } }
    nav a { padding: .5rem .75rem; font-size: .9rem; color: rgba(244,234,219,.8); }
    nav a:hover { color: var(--cream); }
    .chip {
      display: inline-flex; height: 2.6rem; overflow: hidden; border-radius: .7rem;
      background: var(--gold); color: var(--ink); box-shadow: 0 1px 0 rgba(0,0,0,.12);
    }
    .chip button {
      appearance: none; border: 0; background: transparent; color: inherit;
      font: inherit; font-weight: 700; font-size: .7rem; letter-spacing: .08em;
      text-transform: uppercase; padding: 0 .85rem; display: inline-flex; align-items: center; gap: .4rem; cursor: pointer;
    }
    .chip button + button { border-left: 1px solid rgba(26,18,12,.25); }
    .chip button:hover { background: var(--gold-soft); }
    .flag { width: 1.15rem; height: .8rem; border-radius: 2px; display: block; }
    .actions { background: var(--ink-2); border-top: 1px solid rgba(255,255,255,.1); }
    .actions-inner { max-width: 72rem; margin: 0 auto; padding: .65rem 1rem; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; border-radius: .45rem; padding: .45rem .85rem; font-size: .85rem; font-weight: 600; border: 0; cursor: pointer; }
    .btn-tomato { background: var(--tomato); color: #fff; }
    .btn-ghost { background: transparent; color: var(--cream); border: 1px solid rgba(255,255,255,.25); }
    .hero { position: relative; min-height: 78vh; background: var(--ink); color: var(--cream); overflow: hidden; display: flex; align-items: end; }
    .hero img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .45; }
    .hero .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #1a120c 0%, rgba(26,18,12,.75) 55%, rgba(26,18,12,.25) 100%); }
    .hero-inner { position: relative; max-width: 72rem; margin: 0 auto; padding: 3rem 1rem; width: 100%; display: grid; gap: 2rem; }
    @media (min-width: 900px) { .hero-inner { grid-template-columns: 1fr 22rem; align-items: end; } }
    .kicker { font-size: .7rem; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--gold-soft); }
    h1 { font-family: "Cormorant Garamond", serif; font-size: clamp(2.6rem, 6vw, 3.8rem); line-height: .95; margin: .6rem 0 0; font-weight: 600; }
    h1 em { display: block; font-style: italic; color: var(--gold-soft); font-weight: 500; }
    .lead { max-width: 28rem; color: rgba(244,234,219,.8); line-height: 1.55; }
    .cta { display: flex; flex-wrap: wrap; gap: .65rem; margin-top: 1.5rem; }
    .cta .btn { padding: .7rem 1rem; font-size: .95rem; }
    .cta .btn-cream { background: var(--cream); color: var(--ink); }
    .cta .btn-line { background: transparent; color: var(--cream); border: 1px solid rgba(255,255,255,.2); }
    .note { margin-top: 1rem; display: inline-flex; border: 1px solid rgba(224,192,120,.5); background: rgba(26,18,12,.5); color: var(--gold-soft); border-radius: 999px; padding: .4rem .9rem; font-size: .85rem; font-weight: 500; }
    .hero-pie { border-radius: .8rem; overflow: hidden; border: 1px solid rgba(255,255,255,.1); box-shadow: 0 20px 40px rgba(0,0,0,.35); }
    .hero-pie img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .strip { background: var(--ink-2); color: var(--cream); border-bottom: 1px solid var(--line); }
    .strip-inner { max-width: 72rem; margin: 0 auto; padding: 1.1rem 1rem; display: grid; gap: 1rem; }
    @media (min-width: 700px) { .strip-inner { grid-template-columns: 1fr 1fr; } }
    .muted { color: rgba(244,234,219,.7); font-size: .9rem; }
    section.wrap { max-width: 72rem; margin: 0 auto; padding: 3.5rem 1rem; }
    h2 { font-family: "Cormorant Garamond", serif; font-size: 2.2rem; margin: .4rem 0 0; font-weight: 600; }
    .cards { display: grid; gap: 1rem; margin-top: 1.75rem; }
    @media (min-width: 800px) { .cards { grid-template-columns: repeat(4, 1fr); } }
    .card { background: var(--cream); border-radius: .8rem; overflow: hidden; box-shadow: 0 1px 0 rgba(26,18,12,.06); outline: 1px solid var(--line); }
    .card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
    .card .pad { padding: 1rem; }
    .card h3 { font-family: "Cormorant Garamond", serif; font-size: 1.45rem; margin: 0; }
    .card p { margin: .4rem 0 0; color: var(--muted); font-size: .9rem; }
    footer { background: var(--ink); color: var(--cream); margin-top: 2rem; }
    .goldline { height: 6px; background: var(--gold); }
    .foot { max-width: 72rem; margin: 0 auto; padding: 2.5rem 1rem; display: grid; gap: 2rem; }
    @media (min-width: 800px) { .foot { grid-template-columns: 2fr 1fr; } }
    .copy { font-size: 11px; color: rgba(244,234,219,.5); text-align: center; padding: 1rem; border-top: 1px solid rgba(255,255,255,.1); }
    .banner { background: var(--tomato); color: var(--cream); font-size: .9rem; }
    .banner-inner { max-width: 72rem; margin: 0 auto; padding: .65rem 1rem; }
  </style>
</head>
<body>

  <script>
    const KEY = "faillas-lang";
    const ORDER = ["en", "es", "pt"];
    const NAME = { en: "English", es: "Español", pt: "Português" };
    const FLAG = {
      en: '<svg class="flag" viewBox="0 0 19 10"><rect width="19" height="10" fill="#bf0a30"/><rect y="1.1" width="19" height="1.1" fill="#fff"/><rect y="3.3" width="19" height="1.1" fill="#fff"/><rect y="5.5" width="19" height="1.1" fill="#fff"/><rect y="7.7" width="19" height="1.1" fill="#fff"/><rect width="7.6" height="5.4" fill="#002868"/></svg>',
      es: '<svg class="flag" viewBox="0 0 9 6"><rect width="9" height="6" fill="#c60b1e"/><rect y="1.5" width="9" height="3" fill="#ffc400"/></svg>',
      pt: '<svg class="flag" viewBox="0 0 20 14"><rect width="20" height="14" fill="#009b3a"/><polygon points="10,1.4 18.6,7 10,12.6 1.4,7" fill="#fedf00"/><circle cx="10" cy="7" r="2.5" fill="#002776"/></svg>'
    };
    const copy = {
      en: {
        hiringBanner: "We're hiring — join the Failla's team.",
        navHome: "Home", navMenu: "Menu", navAbout: "About", navContact: "Contact",
        orderOnline: "Order Online", call: "Call", viewMenu: "View menu",
        homeKicker: "Phoenixville, Pennsylvania", homeTitle1: "Home of the",
        homeLead: "Family-owned Sicilian cooking — pan-baked pies, red-sauce classics, steaks, and salads. Walk in, call ahead, or order online.",
        pickupFastest: "Pickup orders are fastest by phone.",
        byobPatio: "BYOB · patio", dineTakeDeliver: "Dine-in, takeout, delivery",
        cateringVanLine: "Catering van, tent & food trailer",
        regularsKicker: "What people come back for", regularsTitle: "The regulars' order",
        cardGrandma: "Grandma Pie", cardGrandmaText: "Crisp pan, fresh mozzarella, sauce the owner still crushes by hand.",
        cardFailla: "Failladelphia", cardFaillaText: "Ribeye, Cooper Sharp, smoked mozzarella, sesame crust. Steak or stromboli.",
        cardPasta: "Pasta & Parm", cardPastaText: "Rosa shrimp, eggplant rollatini, chicken parm — the ristorante half of the sign.",
        cardSalads: "Salads", cardSaladsText: "Burrata, caprese, house Italian. Fresh, not an afterthought.",
        footerBlurb: "Family-owned. Sicilian recipes. Phoenixville's Grandma pie — plus pasta, steaks, salads, and catering that shows up.",
        visit: "Visit"
      },
      es: {
        hiringBanner: "Estamos contratando — únete al equipo de Failla's.",
        navHome: "Inicio", navMenu: "Menú", navAbout: "Nosotros", navContact: "Contacto",
        orderOnline: "Pedir en línea", call: "Llamar", viewMenu: "Ver menú",
        homeKicker: "Phoenixville, Pennsylvania", homeTitle1: "Casa de la",
        homeLead: "Cocina siciliana de familia — pizzas al molde, clásicos de salsa roja, steaks y ensaladas. Entre, llame o pida en línea.",
        pickupFastest: "Para recoger, lo más rápido es llamar.",
        byobPatio: "BYOB · patio", dineTakeDeliver: "Comer aquí, para llevar, delivery",
        cateringVanLine: "Van de catering, carpa y food trailer",
        regularsKicker: "Por lo que vuelven", regularsTitle: "El pedido de siempre",
        cardGrandma: "Grandma Pie", cardGrandmaText: "Molde crocante, mozzarella fresca, salsa que el dueño todavía aplasta a mano.",
        cardFailla: "Failladelphia", cardFaillaText: "Ribeye, Cooper Sharp, mozzarella ahumada, masa con sésamo. Steak o stromboli.",
        cardPasta: "Pasta & Parm", cardPastaText: "Camarones Rosa, eggplant rollatini, chicken parm — la mitad ristorante del letrero.",
        cardSalads: "Ensaladas", cardSaladsText: "Burrata, caprese, italiana de la casa. Frescas, no de relleno.",
        footerBlurb: "De familia. Recetas sicilianas. El Grandma pie de Phoenixville — más pasta, steaks, ensaladas y catering que llega.",
        visit: "Visítanos"
      },
      pt: {
        hiringBanner: "Estamos contratando — entre para o time da Failla's.",
        navHome: "Início", navMenu: "Cardápio", navAbout: "Sobre", navContact: "Contato",
        orderOnline: "Pedir online", call: "Ligar", viewMenu: "Ver cardápio",
        homeKicker: "Phoenixville, Pennsylvania", homeTitle1: "Casa da",
        homeLead: "Comida siciliana de família — pizzas na assadeira, clássicos de molho vermelho, steaks e saladas. Entre, ligue ou peça online.",
        pickupFastest: "Para retirar, o mais rápido é ligar.",
        byobPatio: "BYOB · pátio", dineTakeDeliver: "Salão, para viagem, delivery",
        cateringVanLine: "Van de catering, tenda e food trailer",
        regularsKicker: "O que faz o pessoal voltar", regularsTitle: "O pedido dos regulares",
        cardGrandma: "Grandma Pie", cardGrandmaText: "Assadeira crocante, mozzarella fresca, molho que o dono ainda amassa na mão.",
        cardFailla: "Failladelphia", cardFaillaText: "Ribeye, Cooper Sharp, mozzarella defumada, massa com gergelim. Steak ou stromboli.",
        cardPasta: "Pasta & Parm", cardPastaText: "Camarão Rosa, eggplant rollatini, chicken parm — o lado ristorante da placa.",
        cardSalads: "Saladas", cardSaladsText: "Burrata, caprese, italiana da casa. Frescas, não de encher linguiça.",
        footerBlurb: "De família. Receitas sicilianas. A Grandma pie de Phoenixville — mais massa, steaks, saladas e catering que aparece.",
        visit: "Visite"
      }
    };

    function readLang() {
      try {
        const s = localStorage.getItem(KEY);
        if (s === "en" || s === "es" || s === "pt") return s;
      } catch (e) {}
      return "en";
    }
    function saveLang(lang) {
      try { localStorage.setItem(KEY, lang); } catch (e) {}
      try { document.cookie = KEY + "=" + lang + ";path=/;max-age=31536000;samesite=lax"; } catch (e) {}
    }
    function apply(lang) {
      const t = copy[lang];
      document.documentElement.lang = lang === "pt" ? "pt-BR" : lang;
      document.documentElement.setAttribute("data-lang", lang);
      document.querySelectorAll("[data-i]").forEach((el) => {
        const key = el.getAttribute("data-i");
        if (t[key]) el.textContent = t[key];
      });
      const chip = document.getElementById("chip");
      chip.innerHTML = "";
      ORDER.filter((l) => l !== lang).forEach((option) => {
        const b = document.createElement("button");
        b.type = "button";
        b.setAttribute("aria-label", NAME[option]);
        b.innerHTML = FLAG[option] + "<span>" + NAME[option] + "</span>";
        b.addEventListener("click", () => { saveLang(option); apply(option); });
        chip.appendChild(b);
      });
    }
    apply(readLang());
  </script>
</body>
