<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Failla's Pizzeria & Ristorante</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="site.css" />
</head>
<body data-page="home">
  <div id="site-chrome"></div>
  <main id="content">
    <section class="hero">
      <img class="bg" src="https://cdn.jsdelivr.net/gh/sysopx786/faillaspizza-Website@feat/trilingual-switcher/public/images/storefront-night.webp" alt="" />
      <div class="shade"></div>
      <div class="hero-inner">
        <div>
          <p class="kicker" data-i="homeKicker"></p>
          <h1><span data-i="homeTitle1"></span><em>Grandma Pizza</em></h1>
          <p class="lead" data-i="homeLead"></p>
          <div class="cta">
            <a class="btn btn-cream" href="tel:+16102552828"><span data-i="call"></span> 610-255-2828</a>
            <a class="btn btn-line" href="menu.html" data-i="viewMenu"></a>
          </div>
          <p class="note" data-i="pickupFastest"></p>
        </div>
        <div class="hero-pie">
          <img src="https://cdn.jsdelivr.net/gh/sysopx786/faillaspizza-Website@feat/trilingual-switcher/public/images/grandma-pie.webp" alt="Failla's Grandma pie" />
        </div>
      </div>
    </section>
    <div class="strip">
      <div class="strip-inner">
        <div>
          <strong>2669 Charlestown Rd</strong>
          <div class="cream-muted">Phoenixville, PA 19460 · <span data-i="byobPatio"></span></div>
        </div>
        <div>
          <strong data-i="dineTakeDeliver"></strong>
          <div class="cream-muted" data-i="cateringVanLine"></div>
        </div>
      </div>
    </div>
    <section class="wrap">
      <p class="kicker tomato" data-i="regularsKicker"></p>
      <h2 data-i="regularsTitle"></h2>
      <div class="cards">
        <article class="card"><img src="https://cdn.jsdelivr.net/gh/sysopx786/faillaspizza-Website@feat/trilingual-switcher/public/images/grandma-pie.webp" alt="" /><div class="pad"><h3 data-i="cardGrandma"></h3><p data-i="cardGrandmaText"></p></div></article>
        <article class="card"><img src="https://cdn.jsdelivr.net/gh/sysopx786/faillaspizza-Website@feat/trilingual-switcher/public/images/failladelphia-stromboli.webp" alt="" /><div class="pad"><h3 data-i="cardFailla"></h3><p data-i="cardFaillaText"></p></div></article>
        <article class="card"><img src="https://cdn.jsdelivr.net/gh/sysopx786/faillaspizza-Website@feat/trilingual-switcher/public/images/shrimp-pasta.webp" alt="" /><div class="pad"><h3 data-i="cardPasta"></h3><p data-i="cardPastaText"></p></div></article>
        <article class="card"><img src="https://cdn.jsdelivr.net/gh/sysopx786/faillaspizza-Website@feat/trilingual-switcher/public/images/burrata-salad.webp" alt="" /><div class="pad"><h3 data-i="cardSalads"></h3><p data-i="cardSaladsText"></p></div></article>
      </div>
      <p style="margin-top:1.5rem"><a class="btn btn-ink" href="menu.html" data-i="fullMenu"></a></p>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="site.js"></script>
</body>
</html>
