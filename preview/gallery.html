<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery · Failla's Pizzeria & Ristorante</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="site.css" />
</head>
<body data-page="gallery">
  <div id="site-chrome"></div>
  <main id="content" class="wrap">
    <p class="kicker tomato" data-i="galleryKicker"></p>
    <h1 data-i="galleryTitle"></h1>
    <p class="lead" style="color:var(--muted)" data-i="galleryLead"></p>
    <div class="gallery" style="margin-top:2rem">
      <figure><img src="https://cdn.jsdelivr.net/gh/sysopx786/faillaspizza-Website@feat/trilingual-switcher/public/images/grandma-pie.webp" alt="Grandma pie" /><figcaption>Grandma pie</figcaption></figure>
      <figure><img src="https://cdn.jsdelivr.net/gh/sysopx786/faillaspizza-Website@feat/trilingual-switcher/public/images/grandma-pie-overhead.webp" alt="Grandma pie overhead" /><figcaption>Grandma pie overhead</figcaption></figure>
      <figure><img src="https://cdn.jsdelivr.net/gh/sysopx786/faillaspizza-Website@feat/trilingual-switcher/public/images/failladelphia-stromboli.webp" alt="Failladelphia" /><figcaption>Failladelphia</figcaption></figure>
      <figure><img src="https://cdn.jsdelivr.net/gh/sysopx786/faillaspizza-Website@feat/trilingual-switcher/public/images/shrimp-pasta.webp" alt="Pasta" /><figcaption>Pasta</figcaption></figure>
      <figure><img src="https://cdn.jsdelivr.net/gh/sysopx786/faillaspizza-Website@feat/trilingual-switcher/public/images/burrata-salad.webp" alt="Salad" /><figcaption>Salad</figcaption></figure>
      <figure><img src="https://cdn.jsdelivr.net/gh/sysopx786/faillaspizza-Website@feat/trilingual-switcher/public/images/storefront-night.webp" alt="Storefront at night" /><figcaption>The shop at night</figcaption></figure>
      <figure><img src="https://cdn.jsdelivr.net/gh/sysopx786/faillaspizza-Website@feat/trilingual-switcher/public/images/delivery-van.webp" alt="Delivery van" /><figcaption>The van</figcaption></figure>
      <figure><img src="https://cdn.jsdelivr.net/gh/sysopx786/faillaspizza-Website@feat/trilingual-switcher/public/images/vendor-tent.webp" alt="Vendor tent" /><figcaption>Vendor tent</figcaption></figure>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="site.js"></script>
</body>
</html>
