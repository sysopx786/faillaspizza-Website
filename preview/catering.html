<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catering · Failla's Pizzeria & Ristorante</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="site.css" />
</head>
<body data-page="catering">
  <div id="site-chrome"></div>
  <main id="content">
    <section class="page-hero">
      <div class="wrap two">
        <div>
          <p class="kicker" data-i="catCateringKicker"></p>
          <h1 data-i="catTitle"></h1>
          <p class="lead" data-i="catLead"></p>
          <div class="cta">
            <a class="btn btn-cream" href="tel:+16102552828">610-255-2828</a>
            <a class="btn btn-line" href="contact.html" data-i="sendNote"></a>
          </div>
        </div>
        <img src="https://cdn.jsdelivr.net/gh/sysopx786/faillaspizza-Website@feat/trilingual-switcher/public/images/delivery-van.webp" alt="Failla's catering van" style="border-radius:.8rem;object-fit:cover;width:100%" />
      </div>
    </section>
    <section class="wrap">
      <div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(16rem,1fr))">
        <article class="card"><div class="pad"><h3 data-i="vanTitle"></h3><p data-i="vanText"></p></div></article>
        <article class="card"><img src="https://cdn.jsdelivr.net/gh/sysopx786/faillaspizza-Website@feat/trilingual-switcher/public/images/vendor-tent.webp" alt="" /><div class="pad"><h3 data-i="tentTitle"></h3><p data-i="tentText"></p></div></article>
        <article class="card"><div class="pad"><h3 data-i="trailerTitle"></h3><p data-i="trailerText"></p></div></article>
      </div>
      <ul class="list" style="margin-top:2rem">
        <li data-i="send1"></li>
        <li data-i="send2"></li>
        <li data-i="send3"></li>
        <li data-i="send4"></li>
      </ul>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="site.js"></script>
</body>
</html>
