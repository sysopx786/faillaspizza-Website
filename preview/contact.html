<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact · Failla's Pizzeria & Ristorante</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="site.css" />
</head>
<body data-page="contact">
  <div id="site-chrome"></div>
  <main id="content" class="wrap two">
    <div>
      <p class="kicker tomato" data-i="findUs"></p>
      <h1 data-i="contactTitle"></h1>
      <p class="lead" style="color:var(--muted)" data-i="contactLead"></p>
      <p style="margin-top:1.25rem"><a href="tel:+16102552828" style="font-size:1.25rem;font-weight:600">610-255-2828</a><br><span class="muted" data-i="dineTakeCater"></span></p>
      <p><a href="https://maps.app.goo.gl/NchGPaKP2GC58EqC8" target="_blank" rel="noreferrer"><strong>2669 Charlestown Rd</strong><br>Phoenixville, PA 19460</a><br><span class="muted" data-i="cornerOf"></span></p>
      <h2 style="margin-top:2rem;font-size:1.6rem" data-i="hoursTitle"></h2>
      <ul class="hours">
        <li><span data-i="monThu"></span><span>10:30 AM – 9:00 PM</span></li>
        <li><span data-i="friSat"></span><span>10:30 AM – 10:00 PM</span></li>
        <li><span data-i="sun"></span><span data-i="closed"></span></li>
      </ul>
    </div>
    <div>
      <p data-i="sendNoteLead"></p>
      <form class="form" action="mailto:mujtaba.valli@gmail.com" method="get" enctype="text/plain">
        <label><span data-i="labelName"></span><input name="name" required /></label>
        <label><span data-i="labelPhone"></span><input name="phone" /></label>
        <label><span data-i="labelEmail"></span><input type="email" name="email" /></label>
        <label><span data-i="labelMessage"></span><textarea name="body" required></textarea></label>
        <button class="btn btn-ink" type="submit" data-i="submit"></button>
      </form>
      <iframe title="Map" src="https://maps.google.com/maps?q=2669%20Charlestown%20Rd%20Phoenixville%20PA%2019460&output=embed" style="margin-top:1.5rem;width:100%;min-height:16rem;border:0;border-radius:.8rem"></iframe>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="site.js"></script>
</body>
</html>
